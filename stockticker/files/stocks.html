<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Stocks</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.3 -apple-system, "Segoe UI", Roboto, sans-serif; background: #0e1116; color: #e6e9ef; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #222a35; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  button { background: #1d2733; color: #e6e9ef; border: 1px solid #2c3b4d; border-radius: 6px; padding: 7px 11px; font-size: 14px; cursor: pointer; }
  button:active { background: #2a3b50; }
  form { display: flex; gap: 8px; padding: 10px 14px; }
  input[type=text], input[type=number] { flex: 1; min-width: 0; background: #151b23; color: inherit; border: 1px solid #2c3b4d; border-radius: 6px; padding: 8px 10px; font-size: 15px; text-transform: uppercase; }
  input[type=number] { width: 70px; flex: none; text-transform: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #1a212b; }
  .sym { font-weight: 600; font-size: 20px; }
  .name { grid-column: 1; color: #8b97a8; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55vw; }
  .price { text-align: right; font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; }
  .chg { grid-column: 2; text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  .del { grid-row: 1 / span 2; grid-column: 3; padding: 4px 9px; }
  .up { color: #3ecf70; } .down { color: #ff5c5c; } .flat, .muted { color: #8b97a8; }
  .err { color: #ffb454; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: #556; }
  .dot.open { background: #3ecf70; }
  #status { padding: 8px 14px; color: #8b97a8; font-size: 12px; }
  details { padding: 4px 14px 14px; color: #8b97a8; font-size: 13px; }
  details form { padding: 8px 0 0; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>Stocks</h1>
  <button id="refresh" type="button">Refresh</button>
</header>
<form id="addform" autocomplete="off">
  <input id="sym" type="text" placeholder="Add code, e.g. AAPL or ASX:EOS" maxlength="24" autocapitalize="characters" spellcheck="false">
  <button type="submit">Add</button>
</form>
<ul id="list"></ul>
<div id="status"></div>
<details>
  <summary>Settings</summary>
  <form id="setform">
    <label for="ivl">Refresh every (s)</label>
    <input id="ivl" type="number" min="60" max="86400" step="30">
    <button type="submit">Save</button>
  </form>
  <p>Quotes are delayed and come from Yahoo Finance. Not financial advice.</p>
</details>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var seq = 1;

  function sid() {
    var m = document.cookie.match(/(?:^|; )Admin-Token=([^;]*)/);
    return m ? m[1].trim() : "";
  }

  function rpc(method, args) {
    return fetch("/rpc", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: seq++, method: "call", params: [sid(), "stockticker", method, args || {}] })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.error) throw new Error(j.error.message || "rpc error");
      return j.result;
    });
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function fmt(n) {
    if (typeof n !== "number") return "-";
    return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: n < 1 ? 4 : 2 });
  }

  function render(cfg) {
    var list = $("list");
    list.textContent = "";
    var quotes = cfg.quotes || [];
    var bySym = {};
    quotes.forEach(function (q) { bySym[q.symbol] = q; });
    (cfg.symbols || []).forEach(function (s) {
      var q = bySym[s] || { symbol: s, error: "pending" };
      var li = el("li");
      var sym = el("span", "sym");
      sym.appendChild(el("span", "dot" + (q.state === "open" ? " open" : "")));
      sym.appendChild(document.createTextNode(s));
      li.appendChild(sym);
      li.appendChild(el("span", "price", q.price !== undefined ? fmt(q.price) : "-"));
      var del = el("button", "del", "\u00d7");
      del.type = "button";
      del.title = "Remove";
      del.addEventListener("click", function () { act("remove_symbol", { symbol: s }); });
      li.appendChild(del);
      li.appendChild(el("span", "name", q.name || q.currency || ""));
      var cls = "flat", txt = "";
      if (q.error && q.price === undefined) { cls = "err"; txt = q.error; }
      else if (typeof q.pct === "number") {
        cls = q.pct > 0 ? "up" : q.pct < 0 ? "down" : "flat";
        txt = (q.change >= 0 ? "+" : "") + fmt(q.change) + "  (" + (q.pct >= 0 ? "+" : "") + q.pct.toFixed(2) + "%)";
        if (q.stale) txt += " *";
      }
      li.appendChild(el("span", "chg " + cls, txt));
      list.appendChild(li);
    });
    if (!(cfg.symbols || []).length) list.appendChild(el("li", "muted", "Watchlist is empty."));
    $("ivl").value = cfg.interval || 300;
    var upd = cfg.updated ? "Updated " + new Date(cfg.updated * 1000).toLocaleTimeString() : "No data yet";
    $("status").textContent = upd + (cfg.enabled === 0 ? " \u2014 background updates disabled" : "");
  }

  function load() {
    return rpc("get_config").then(render).catch(function (e) {
      $("status").textContent = sid() ? "Error: " + e.message : "Not logged in. Log in to the admin panel first, then reload.";
    });
  }

  function act(method, args, after) {
    return rpc(method, args).then(function (r) {
      if (r && r.ok === false) { $("status").textContent = "Error: " + r.error; return; }
      return new Promise(function (res) { setTimeout(res, 2500); }).then(load);
    }).catch(function (e) { $("status").textContent = "Error: " + e.message; });
  }

  $("addform").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = $("sym").value.trim();
    if (!v) return;
    $("sym").value = "";
    $("status").textContent = "Adding " + v.toUpperCase() + "\u2026";
    act("add_symbol", { symbol: v });
  });
  $("refresh").addEventListener("click", function () { act("refresh"); });
  $("setform").addEventListener("submit", function (ev) {
    ev.preventDefault();
    act("set_config", { interval: parseInt($("ivl").value, 10) || 300 });
  });

  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
